<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acreditación Gala 2026</title>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #060d1a; color: #ffffff; padding: 14px; text-align: center; }
    .container { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    
    .header { border-bottom: 1px solid rgba(224, 169, 109, 0.3); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 17px; font-weight: 800; color: #fef08a; text-align: left; }
    .subtitle { font-size: 10px; color: #e0a96d; text-transform: uppercase; letter-spacing: 1px; }
    .badge { background: #064e3b; color: #34d399; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid #10b981; }

    .tab-bar { display: flex; background: #0f172a; padding: 4px; border-radius: 12px; border: 1px solid #1e293b; }
    .tab-btn { flex: 1; padding: 10px; font-size: 12px; font-weight: 700; border: none; border-radius: 8px; background: transparent; color: #94a3b8; cursor: pointer; }
    .tab-btn.active { background: #f59e0b; color: #020617; }

    .video-wrapper { position: relative; width: 100%; height: 330px; background: #000; border-radius: 16px; overflow: hidden; border: 2px solid #f59e0b; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scan-guide { position: absolute; width: 220px; height: 220px; border: 2px dashed #f59e0b; border-radius: 16px; pointer-events: none; box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45); }
    
    .btn-start { background: linear-gradient(135deg, #f59e0b, #d97706); color: #020617; font-size: 15px; font-weight: 800; padding: 14px 24px; border-radius: 12px; border: none; cursor: pointer; width: 85%; z-index: 10; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }

    .input-box { background: #0f172a; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #1e293b; }
    input[type="text"] { background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; font-weight: 700; text-align: center; text-transform: uppercase; width: 100%; }

    .card { border-radius: 16px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
    .card-success { background: #064e3b; border: 2px solid #10b981; }
    .card-already { background: #881337; border: 2px solid #f43f5e; }
    .card-error { background: #78350f; border: 2px solid #f59e0b; }

    .card-title { font-size: 20px; font-weight: 900; text-transform: uppercase; }
    .guest-info { background: rgba(0,0,0,0.5); border-radius: 12px; padding: 12px; text-align: left; font-size: 13px; line-height: 1.5; border: 1px solid rgba(255,255,255,0.1); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; text-align: center; }
    .grid-item { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 6px; }
    .grid-num { font-size: 22px; font-weight: 900; color: #ffffff; }

    .btn-next { background: rgba(255,255,255,0.15); color: #fff; font-size: 13px; font-weight: 800; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 6px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div>
      <div class="title">GALA LIDERAZGO</div>
      <div class="subtitle">Acreditación & Control 2026</div>
    </div>
    <div class="badge">ONLINE</div>
  </div>

  <div id="mainControls">
    <div class="tab-bar">
      <button id="tabCam" class="tab-btn active" onclick="switchTab('cam')">📷 CÁMARA VIVO</button>
      <button id="tabUsb" class="tab-btn" onclick="switchTab('usb')">⌨️ MANUAL / USB</button>
    </div>

    <div id="panelCam" class="video-wrapper" style="margin-top: 10px;">
      <video id="videoElement" playsinline autoplay muted></video>
      <div id="scanGuide" class="scan-guide hidden"></div>
      <div id="btnStartPrompt" style="position: absolute;">
        <button class="btn-start" onclick="initLiveCamera()">▶ INICIAR CÁMARA</button>
      </div>
    </div>

    <div id="panelUsb" class="input-box hidden" style="margin-top: 10px;">
      <p style="font-size: 13px; color: #94a3b8;">Código de Ticket:</p>
      <input type="text" id="manualInput" placeholder="Ej: CLI-0011-9c7b1c8c">
      <button class="btn-start" style="width: 100%; margin-top: 8px;" onclick="submitManual()">VALIDAR TICKET</button>
    </div>
  </div>

  <div id="loadingBox" class="card card-error hidden">
    <div style="font-size: 18px; font-weight: 800;">⏳ VALIDANDO TICKET...</div>
    <p style="font-size: 12px; color: #fef08a;">Consultando base de datos y generando Tótem</p>
  </div>

  <div id="resultBox" class="hidden"></div>

  <div style="font-size: 10px; color: #64748b; margin-top: 8px;">
    Gala Liderazgo 2026 &copy; Salones del Puerto
  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzg4FE50_Bj9YCtwf8aOVWaOc8BFMZY01NgMgl4vpjSBmpupKdImieFspbauuD7vRVt/exec";

  let codeReader = null;
  let isScanning = false;
  let autoResetTimer = null;
  let audioContext = null;

  function initAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
  }

  function playSound(type) {
    initAudio();
    if (!audioContext) return;
    try {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.connect(gain);
      gain.connect(audioContext.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, audioContext.currentTime);
        osc.frequency.setValueAtTime(880.00, audioContext.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
        osc.start();
        osc.stop(audioContext.currentTime + 0.25);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioContext.currentTime);
        gain.gain.setValueAtTime(0.4, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
        osc.start();
        osc.stop(audioContext.currentTime + 0.3);
      }
    } catch (e) {}
  }

  function switchTab(mode) {
    document.getElementById('resultBox').classList.add('hidden');
    if (mode === 'cam') {
      document.getElementById('panelCam').classList.remove('hidden');
      document.getElementById('panelUsb').classList.add('hidden');
      document.getElementById('tabCam').className = 'tab-btn active';
      document.getElementById('tabUsb').className = 'tab-btn';
    } else {
      stopCamera();
      document.getElementById('panelCam').classList.add('hidden');
      document.getElementById('panelUsb').classList.remove('hidden');
      document.getElementById('tabCam').className = 'tab-btn';
      document.getElementById('tabUsb').className = 'tab-btn active';
      document.getElementById('manualInput').focus();
    }
  }

  async function initLiveCamera() {
    initAudio();
    document.getElementById('btnStartPrompt').classList.add('hidden');
    document.getElementById('scanGuide').classList.remove('hidden');

    if (!codeReader) codeReader = new ZXing.BrowserQRCodeReader();

    try {
      isScanning = true;
      await codeReader.decodeFromVideoDevice(undefined, 'videoElement', (result, err) => {
        if (result && isScanning) {
          isScanning = false;
          onQrDetected(result.text.trim());
        }
      });
    } catch (err) {
      alert("Error al iniciar cámara: " + err.message);
      document.getElementById('btnStartPrompt').classList.remove('hidden');
      document.getElementById('scanGuide').classList.add('hidden');
    }
  }

  function stopCamera() {
    isScanning = false;
    if (codeReader) codeReader.reset();
    document.getElementById('btnStartPrompt').classList.remove('hidden');
    document.getElementById('scanGuide').classList.add('hidden');
  }

  // Consulta por JSONP (Sin bloqueos de CORS entre servidores)
  function onQrDetected(ticketId) {
    document.getElementById('mainControls').classList.add('hidden');
    document.getElementById('loadingBox').classList.remove('hidden');

    const callbackName = 'jsonp_callback_' + Date.now();
    
    // Timeout por si demora la conexión
    const timeoutTimer = setTimeout(() => {
      cleanup();
      onError(new Error('Tiempo de espera agotado al conectar'));
    }, 10000);

    function cleanup() {
      clearTimeout(timeoutTimer);
      delete window[callbackName];
      const el = document.getElementById(callbackName);
      if (el) el.remove();
    }

    window[callbackName] = function(data) {
      cleanup();
      onSuccess(data);
    };

    const script = document.createElement('script');
    script.id = callbackName;
    script.src = `${API_URL}?ticketId=${encodeURIComponent(ticketId)}&callback=${callbackName}`;
    script.onerror = function() {
      cleanup();
      onError(new Error('Error de red con la base de datos'));
    };

    document.body.appendChild(script);
  }

  function submitManual() {
    initAudio();
    const val = document.getElementById('manualInput').value.trim();
    if (val !== '') {
      onQrDetected(val);
      document.getElementById('manualInput').value = '';
    }
  }

  function onSuccess(res) {
    document.getElementById('loadingBox').classList.add('hidden');
    const resBox = document.getElementById('resultBox');
    resBox.classList.remove('hidden');

    let html = '';
    if (res.status === 'SUCCESS') {
      playSound('success');
      html += '<div class="card card-success">';
      html += '<div class="card-title" style="color: #34d399;">✅ ACCESO AUTORIZADO</div>';
      html += '<p style="font-size: 11px; color: #a7f3d0;">Placa Tótem generada y enviada a pantalla</p>';
    } else if (res.status === 'ALREADY_USED') {
      playSound('error');
      html += '<div class="card card-already">';
      html += '<div class="card-title" style="color: #fb7185;">⚠️ YA INGRESADO</div>';
      html += '<p style="font-size: 11px; color: #fecdd3;">Ingresó previamente a las ' + (res.horaIngreso || '') + '</p>';
    } else {
      playSound('error');
      html += '<div class="card card-error">';
      html += '<div class="card-title" style="color: #fbbf24;">❌ TICKET INVÁLIDO</div>';
      html += '<p style="font-size: 11px;">No figura en la base de datos</p>';
    }

    html += '<div class="guest-info">';
    html += '<div><strong>INVITADO:</strong> ' + (res.nombre || 'DESCONOCIDO') + '</div>';
    html += '<div><strong>ROL:</strong> ' + (res.rol || '---') + '</div>';
    html += '<div class="grid-3">';
    html += '<div class="grid-item"><div style="font-size:9px; color:#e0a96d;">MESA</div><div class="grid-num">' + (res.mesa || '-') + '</div></div>';
    html += '<div class="grid-item"><div style="font-size:9px; color:#cbd5e1;">GRUPO</div><div class="grid-num">' + (res.grupo || '-') + '</div></div>';
    html += '<div class="grid-item"><div style="font-size:9px; color:#cbd5e1;">ORDEN</div><div class="grid-num">' + (res.orden || '-') + '</div></div>';
    html += '</div>';

    if (res.notas) {
      html += '<div style="margin-top:6px; padding:6px; background:rgba(245,158,11,0.25); border-radius:6px; font-size:11px;">';
      html += '<strong>OBS:</strong> ' + res.notas;
      html += '</div>';
    }

    html += '</div>';
    html += '<button class="btn-next" onclick="resetToScan()">Siguiente Escaneo (4s)</button>';
    html += '</div>';

    resBox.innerHTML = html;
    clearTimeout(autoResetTimer);
    autoResetTimer = setTimeout(resetToScan, 4000);
  }

  function onError(err) {
    playSound('error');
    document.getElementById('loadingBox').classList.add('hidden');
    const resBox = document.getElementById('resultBox');
    resBox.classList.remove('hidden');
    let html = '<div class="card card-error"><div class="card-title" style="color: #fbbf24;">⚠️ ERROR</div><p style="font-size:12px;">' + (err.message || 'Falla al conectar') + '</p><button class="btn-next" onclick="resetToScan()">Reintentar</button></div>';
    resBox.innerHTML = html;
  }

  function resetToScan() {
    clearTimeout(autoResetTimer);
    document.getElementById('resultBox').classList.add('hidden');
    document.getElementById('mainControls').classList.remove('hidden');
    const isUsb = !document.getElementById('panelUsb').classList.contains('hidden');
    if (!isUsb) initLiveCamera();
    else document.getElementById('manualInput').focus();
  }
</script>
</body>
</html>
